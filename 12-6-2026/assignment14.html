<!DOCTYPE html>
<html>
<head>
    <title>Product Cards</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 20px;
}
h1 {
    text-align: center;
}
.products {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
}
.card {
    width: 220px;
    background-color: white;
    padding: 15px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    transition: 0.3s;
}
.card:hover {
    transform: translateY(-10px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
}
.card img {
    width: 100%;
    height: 150px;
    border-radius: 10px;
}
.price {
    color: green;
    font-size: 20px;
    font-weight: bold;
}
button {
    background-color: orange;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
}
button:hover {
    background-color: darkorange;
}
</style>
</head>
<body>
    <h1>Our Products</h1>
    <div class="products">
        <div class="card">
            <img src="https://thf.bing.com/th/id/OIP.9_eThFJObI5vF7yBKc8uOAHaE8?w=234&h=180&c=7&r=0&o=7&cb=thfc1falcon2&pid=1.7&rm=3"alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p class="price">₹2,499</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://thf.bing.com/th/id/OIP.1a4epZsn_DJWe_yXLZJXHQHaHa?w=171&h=180&c=7&r=0&o=7&cb=thfc1falcon2&pid=1.7&rm=3" alt="Headphones">
            <h3>Headphones</h3>
            <p class="price">₹1,299</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://thf.bing.com/th/id/OIP.gzbpNV-A6t8yy9cJ1yMRXgHaHa?w=167&h=180&c=7&r=0&o=7&cb=thfc1falcon2&pid=1.7&rm=3" alt="Bluetooth Speaker">
            <h3>Bluetooth Speaker</h3>
            <p class="price">₹1,799</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://thf.bing.com/th/id/OIP.ekmnn3Y_bQYWRiuO-vntMgHaEJ?w=328&h=184&c=7&r=0&o=7&cb=thfc1falcon2&pid=1.7&rm=3"alt="Wireless Mouse">
            <h3>Wireless Mouse</h3>
            <p class="price">₹699</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://www.bing.com/th/id/OIP.Y57UK4RWddRejoWVy8XC2QHaE8?w=193&h=135&c=8&rs=1&qlt=90&o=6&pid=3.1&rm=5" alt="Keyboard">
            <h3>Keyboard</h3>
            <p class="price">₹999</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <img src="https://thf.bing.com/th/id/OIP.KjEWXS8f_7OEE7KC7AH5eQHaHa?w=180&h=180&c=7&r=0&o=7&cb=thfc1falcon2&pid=1.7&rm=5" alt="Power Bank">
            <h3>Power Bank</h3>
            <p class="price">₹1,499</p>
            <button>Buy Now</button>
        </div>
    </div>
</body>
</html>
