<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Dashboard Clone</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #121212;
  color: white;
}

.container {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 250px; /* Fixed Width */
  background: #000;
  padding: 20px;
}

.sidebar h2 {
  margin-bottom: 30px;
}

.sidebar ul {
  list-style: none;
}

.sidebar li {
  padding: 12px 0;
  cursor: pointer;
}

.sidebar li:hover {
  color: #1db954;
}

/* Content Area */
.content {
  flex: 1;
  padding: 20px;
}

.content section {
  margin-bottom: 40px;
}

.content h2 {
  margin-bottom: 15px;
}

/* Song Cards */
.song-container {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.song-card {
  flex: 1 1 180px;
  min-height: 150px;
  background: #181818;
  border-radius: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: 0.3s;
}

.song-card:hover {
  background: #282828;
  transform: scale(1.03);
}
</style>  
</head>
<body>

  <div class="container">
    <aside class="sidebar">
      <h2>Spotify</h2>
      <nav>
        <ul>
          <li>🏠 Home</li>
          <li>🔍 Search</li>
          <li>📚 Library</li>
        </ul>
      </nav>
    </aside>>
    <main class="content">
<section>
